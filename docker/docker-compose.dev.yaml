x-default-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "${DVT_DOCKER_LOG_MAX_SIZE:-100m}"
      max-file: "${DVT_DOCKER_LOG_MAX_FILE:-5}"

services:
  postgres:
    <<: *default-logging
    image: postgres:15.3-alpine
    container_name: dvt-postgres
    environment:
      POSTGRES_USER: ${DVT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DVT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DVT_POSTGRES_DB:-DVT}
    ports:
      - "15433:5432"
    volumes:
      - ${PG_DATA_VOLUME_PATH:-pg-data}:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - dvt-net

  redisinsight:
    <<: *default-logging
    image: redis/redisinsight:latest
    container_name: dvt-redisinsight
    restart: unless-stopped
    ports:
      - "15540:5540"
    volumes:
      - ${REDISINSIGHT_DATA_VOLUME_PATH:-redisinsight-data}:/data
    depends_on:
      - valkey
    networks:
      - dvt-net

  valkey:
    <<: *default-logging
    image: valkey/valkey:7.2-alpine
    container_name: dvt-valkey
    ports:
      - "16379:6379"
    environment:
      VALKEY_PASSWORD: ${DVT_VALKEY_PASSWORD:-valkeypass}
    command: >
      valkey-server
      --save ""
      --appendonly no
      --loglevel warning
      --requirepass ${DVT_VALKEY_PASSWORD:-valkeypass}
    volumes:
      - ${VALKEY_DATA_VOLUME_PATH:-valkey-data}:/data
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG || exit 1" ]
      interval: 5s
      timeout: 120s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - dvt-net

  orchestrator:
    <<: *default-logging
    image: dvt/orchestrator-dev:latest
    build:
      context: .
      dockerfile: services/orchestrator/docker/dev.Dockerfile
      additional_contexts:
        dvt_deps_image: "service:deps"
        dvt_dev_builder_image: "service:dev-builder"
        dvt_base_image: "service:base"
        dvt_base_odbc_image: "service:base-odbc"
    container_name: dvt-orchestrator
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DVT_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${DVT_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${DVT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DVT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DVT_POSTGRES_DB:-DVT}
      MIGRATION_WAIT_TIMEOUT_SEC: ${DVT_MIGRATION_WAIT_TIMEOUT_SEC:-300}

      ORCHESTRATOR_HOST: ${DVT_ORCHESTRATOR_INTERNAL_HOST:-0.0.0.0}
      ORCHESTRATOR_PORT: ${DVT_ORCHESTRATOR_INTERNAL_PORT:-8250}

      VALKEY_HOST: ${DVT_VALKEY_HOST:-valkey}
      VALKEY_PORT: ${DVT_VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${DVT_VALKEY_PASSWORD:-valkeypass}
      VALKEY_DB: ${DVT_VALKEY_DB:-0}
      CELERY_VISIBILITY_TIMEOUT_SEC: ${DVT_CELERY_VISIBILITY_TIMEOUT_SEC:-28800}


      GRPC_FORWARD_SERVICE_HOST: ${DVT_GRPC_FORWARD_SERVICE_HOST:-gateway}
      GRPC_FORWARD_SERVICE_PORT: ${DVT_GRPC_FORWARD_SERVICE_PORT:-50561}
      GRPC_FORWARD_SERVICE_TOKEN: ${DVT_GRPC_FORWARD_SERVICE_TOKEN:-forward-secret-token}
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dvt-net

  task-worker:
    <<: *default-logging
    image: dvt/task-worker-dev:latest
    build:
      context: .
      dockerfile: services/task_worker/docker/dev.Dockerfile
      additional_contexts:
        dvt_deps_image: "service:deps"
        dvt_dev_builder_image: "service:dev-builder"
        dvt_base_image: "service:base"
        dvt_base_odbc_image: "service:base-odbc"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DVT_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${DVT_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${DVT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DVT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DVT_POSTGRES_DB:-DVT}
      MIGRATION_WAIT_TIMEOUT_SEC: ${DVT_MIGRATION_WAIT_TIMEOUT_SEC:-300}

      GATEWAY_HOST: ${DVT_GATEWAY_HOST:-gateway}
      GATEWAY_PORT: ${DVT_GATEWAY_PORT:-8000}

      TASK_WORKER_HOST: ${DVT_TASK_WORKER_INTERNAL_HOST:-0.0.0.0}
      TASK_WORKER_PORT: ${DVT_TASK_WORKER_INTERNAL_PORT:-8000}

      DISABLE_STORE: ${DVT_DISABLE_STORE:-false}

      GRPC_FORWARD_SERVICE_HOST: ${DVT_GRPC_FORWARD_SERVICE_HOST:-gateway}
      GRPC_FORWARD_SERVICE_PORT: ${DVT_GRPC_FORWARD_SERVICE_PORT:-50561}
      GRPC_FORWARD_SERVICE_TOKEN: ${DVT_GRPC_FORWARD_SERVICE_TOKEN:-forward-secret-token}
      GRPC_ENABLE_FORK_SUPPORT: true
      GRPC_POLL_STRATEGY: epoll1
      EXTENSIONS_DATA_DIR: ./extensions
      DVT_BUILD_ID: ${DVT_BUILD_ID:-}

      VALKEY_HOST: ${DVT_VALKEY_HOST:-valkey}
      VALKEY_PORT: ${DVT_VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${DVT_VALKEY_PASSWORD:-valkeypass}
      VALKEY_DB: ${DVT_VALKEY_DB:-0}
      CELERY_VISIBILITY_TIMEOUT_SEC: ${DVT_CELERY_VISIBILITY_TIMEOUT_SEC:-28800}

    depends_on:
      valkey:
        condition: service_healthy
      orchestrator:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ${EXTENSIONS_VOLUME_PATH:-./extensions}:/app/extensions
    networks:
      - dvt-net

  project-scheduler:
    <<: *default-logging
    image: dvt/project-scheduler-dev:latest
    build:
      context: .
      dockerfile: services/project_scheduler/docker/dev.Dockerfile
      additional_contexts:
        dvt_deps_image: "service:deps"
        dvt_dev_builder_image: "service:dev-builder"
        dvt_base_image: "service:base"
        dvt_base_odbc_image: "service:base-odbc"
    container_name: dvt-project-scheduler
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_healthy
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${DVT_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${DVT_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${DVT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DVT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DVT_POSTGRES_DB:-DVT}
      MIGRATION_WAIT_TIMEOUT_SEC: ${DVT_MIGRATION_WAIT_TIMEOUT_SEC:-300}

      ORCHESTRATOR_HOST: ${DVT_ORCHESTRATOR_HOST:-orchestrator}
      ORCHESTRATOR_PORT: ${DVT_ORCHESTRATOR_PORT:-8250}

      VALKEY_HOST: ${DVT_VALKEY_HOST:-valkey}
      VALKEY_PORT: ${DVT_VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${DVT_VALKEY_PASSWORD:-valkeypass}
      VALKEY_DB: ${DVT_VALKEY_DB:-0}

      GRPC_FORWARD_SERVICE_HOST: ${DVT_GRPC_FORWARD_SERVICE_INTERNAL_HOST:-0.0.0.0}
      GRPC_FORWARD_SERVICE_PORT: ${DVT_GRPC_FORWARD_SERVICE_PORT:-50561}
      GRPC_FORWARD_SERVICE_TOKEN: ${DVT_GRPC_FORWARD_SERVICE_TOKEN:-forward-secret-token}

      PROJECT_SCHEDULER_HOST: 0.0.0.0
      PROJECT_SCHEDULER_PORT: 8000
    networks:
      - dvt-net

  installation_manager:
    <<: *default-logging
    image: dvt/installation_manager-dev:latest
    build:
      context: .
      dockerfile: services/installation_manager/Dockerfile
    container_name: dvt-installation_manager
    environment:
      UPDATE_SERVICE_COMPOSE_FILES: /app/docker/docker-compose.base.yaml;/app/docker/docker-compose.dev.yaml
      UPDATE_SERVICE_PROJECT_DIR: /app
      UPDATE_SERVICE_TARGET_SERVICES: orchestrator;task-worker;project-scheduler;gateway;dvt-ai-mcp;ui;proxy
      UPDATE_SERVICE_MODE: build
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-visual_transformer}
      CONTAINER_REGISTRY_URL: ${CONTAINER_REGISTRY_URL}
      DVT_AI_MCP_ENABLED: ${DVT_AI_MCP_ENABLED:-false}
      DVT_AI_MCP_INTERNAL_SECRET: ${DVT_AI_MCP_INTERNAL_SECRET:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      DOCKER_BUILDKIT: 1
      COMPOSE_DOCKER_CLI_BUILD: 1
    ports:
      - "${DVT_UPDATE_SERVICE_EXTERNAL_PORT:-8888}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
    healthcheck:
      test: [ "CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\"" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dvt-net

  gateway:
    <<: *default-logging
    image: dvt/gateway-dev:latest
    build:
      context: .
      dockerfile: services/gateway/docker/dev.Dockerfile
      additional_contexts:
        dvt_deps_image: "service:deps"
        dvt_dev_builder_image: "service:dev-builder"
        dvt_base_image: "service:base"
        dvt_base_odbc_image: "service:base-odbc"
    container_name: dvt-gateway
    ports:
      - "8001:8000"
    expose:
      - "50561"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: ${DVT_POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${DVT_POSTGRES_PORT:-5432}
      POSTGRES_USER: ${DVT_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${DVT_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${DVT_POSTGRES_DB:-DVT}

      VALKEY_HOST: ${DVT_VALKEY_HOST:-valkey}
      VALKEY_PORT: ${DVT_VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${DVT_VALKEY_PASSWORD:-valkeypass}
      VALKEY_DB: ${DVT_VALKEY_DB:-0}
      CELERY_VISIBILITY_TIMEOUT_SEC: ${DVT_CELERY_VISIBILITY_TIMEOUT_SEC:-28800}

      GATEWAY_HOST: ${DVT_GATEWAY_INTERNAL_HOST:-0.0.0.0}
      GATEWAY_PORT: ${DVT_GATEWAY_INTERNAL_PORT:-8000}

      ORCHESTRATOR_HOST: ${DVT_ORCHESTRATOR_HOST:-orchestrator}
      ORCHESTRATOR_PORT: ${DVT_ORCHESTRATOR_PORT:-8250}

      GRPC_FORWARD_SERVICE_HOST: ${DVT_GRPC_FORWARD_SERVICE_INTERNAL_HOST:-0.0.0.0}
      GRPC_FORWARD_SERVICE_PORT: ${DVT_GRPC_FORWARD_SERVICE_PORT:-50561}
      GRPC_FORWARD_SERVICE_TOKEN: ${DVT_GRPC_FORWARD_SERVICE_TOKEN:-forward-secret-token}

      JWT_ACCESS_TOKEN_SECRET_KEY: ${DVT_JWT_ACCESS_TOKEN_SECRET_KEY:-}
      JWT_REFRESH_TOKEN_SECRET_KEY: ${DVT_JWT_REFRESH_TOKEN_SECRET_KEY:-}
      JWT_ONETIME_TOKEN_SECRET_KEY: ${DVT_JWT_ONETIME_TOKEN_SECRET_KEY:-}
      JWT_API_TOKEN_SECRET_KEY: ${DVT_JWT_API_TOKEN_SECRET_KEY:-}
      CODE_HASH_SALT: ${DVT_CODE_HASH_SALT:-}

      GATEWAY_ORIGINS: ${DVT_PUBLIC_URL:-http://localhost:5173}
      GATEWAY_COOKIE_SECURE: ${DVT_COOKIE_SECURE:-false}

      PROJECT_SCHEDULER_HOST: ${PROJECT_SCHEDULER_HOST:-project-scheduler}
      PROJECT_SCHEDULER_PORT: ${PROJECT_SCHEDULER_PORT:-8000}

      EXTENSIONS_DISTRIBUTOR_URL: ${DVT_EXTENSIONS_DISTRIBUTOR_URL}
      EXTENSIONS_DATA_DIR: ./extensions

      DVT_ENABLE_AI_ANALYSIS: ${DVT_ENABLE_AI_ANALYSIS:-false}
      DVT_AI_SERVICE_URL: ${DVT_AI_SERVICE_URL}
      DVT_AI_SERVICE_API_KEY: ${DVT_AI_SERVICE_API_KEY}
      DVT_AI_MCP_ENABLED: ${DVT_AI_MCP_ENABLED:-false}
      DVT_AI_MCP_INTERNAL_SECRET: ${DVT_AI_MCP_INTERNAL_SECRET:-}

    healthcheck:
      test: [ "CMD", "python3", "/app/scripts/health/check_gateway_health.py" ]
      interval: 5s
      timeout: 60s
      retries: 8
      start_period: 60s
    
    depends_on:
      postgres:
        condition: service_started
      valkey:
        condition: service_healthy

    restart: unless-stopped
    volumes:
      - ${EXTENSIONS_VOLUME_PATH:-./extensions}:/app/extensions
    networks:
      - dvt-net

  dvt-ai-mcp:
    <<: *default-logging
    profiles: [ "ai-mcp" ]
    image: dvt/dvt-ai-mcp-dev:latest
    build:
      context: .
      dockerfile: services/dvt_ai_mcp/Dockerfile
    container_name: dvt-ai-mcp
    environment:
      DVT_ENVIRONMENT: dev
      DVT_PUBLIC_URL: ${DVT_PUBLIC_URL:-http://localhost}
      DVT_AI_MCP_GATEWAY_URL: http://gateway:${DVT_GATEWAY_PORT:-8000}
      DVT_AI_MCP_INTERNAL_SECRET: ${DVT_AI_MCP_INTERNAL_SECRET:-}
      DVT_AI_MCP_HOST: 0.0.0.0
      DVT_AI_MCP_PORT: 8000
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - dvt-net

  ui:
    <<: *default-logging
    image: dvt/ui-dev:latest
    build:
      context: ${UI_BUILD_CONTEXT:-services/ui}
      dockerfile:  ${UI_DOCKERFILE:-Dockerfile}
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: dvt-ui
    expose:
      - "80"
    ports:
      - "81:80"
    environment:
      INACTIVE_TAB_SUFFIX: ${DVT_INACTIVE_TAB_SUFFIX:-DVT}
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/" ]
      interval: 7s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dvt-net

  proxy:
    <<: *default-logging
    image: dvt/proxy-dev:latest
    build:
      context: ./services/proxy
      dockerfile: Dockerfile
    container_name: dvt-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DVT_PUBLIC_URL: ${DVT_PUBLIC_URL:-http://localhost}
      GATEWAY_HOST: ${DVT_GATEWAY_HOST:-gateway}
      GATEWAY_PORT: ${DVT_GATEWAY_PORT:-8000}
      DVT_AI_MCP_ENABLED: ${DVT_AI_MCP_ENABLED:-false}
      AI_MCP_HOST: ${DVT_AI_MCP_HOST:-dvt-ai-mcp}
      AI_MCP_PORT: ${DVT_AI_MCP_PORT:-8000}
      UI_HOST: ${DVT_UI_HOST:-ui}
      UI_PORT: ${DVT_UI_PORT:-80}
    depends_on:
      gateway:
        condition: service_healthy
      ui:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dvt-net

volumes:
  pg-data:
  redisinsight-data:
  valkey-data:
  minio-data:

networks:
  dvt-net:
    external: true
