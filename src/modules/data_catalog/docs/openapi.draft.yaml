"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
  "schemas":
    "EntityReference":
      "type": "object"
      "additionalProperties": false
      "properties":
        "id":
          "type": "string"
          "format": "uuid"
        "type":
          "type": "string"
        "name":
          "type": "string"
        "fullyQualifiedName":
          "type": "string"
        "displayName":
          "type": "string"
        "href":
          "type": "string"
          "format": "uri-reference"
      "required":
        - "id"
        - "type"
    "ReferenceInput":
      "oneOf":
        -
          "type": "object"
          "additionalProperties": false
          "properties":
            "id":
              "type": "string"
              "format": "uuid"
            "expectedRevision":
              "type": "string"
          "required":
            - "id"
            - "expectedRevision"
        -
          "type": "object"
          "additionalProperties": false
          "properties":
            "clientId":
              "type": "string"
          "required":
            - "clientId"
    "Paging":
      "type": "object"
      "additionalProperties": false
      "properties":
        "before":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "after":
          "anyOf":
            -
              "type": "string"
            -
              "type": "null"
        "total":
          "type": "integer"
          "minimum": 0
      "required":
        - "before"
        - "after"
        - "total"
    "Error":
      "type": "object"
      "additionalProperties": false
      "properties":
        "code":
          "type": "string"
        "message":
          "type": "string"
        "details":
          "type": "array"
          "items":
            "type": "object"
            "additionalProperties": true
      "required":
        - "code"
        - "message"
    "JsonPatch":
      "type": "array"
      "items":
        "oneOf":
          -
            "type": "object"
            "additionalProperties": false
            "properties":
              "op":
                "enum":
                  - "add"
                  - "replace"
                  - "test"
              "path":
                "type": "string"
              "value":
                {}
            "required":
              - "op"
              - "path"
              - "value"
          -
            "type": "object"
            "additionalProperties": false
            "properties":
              "op":
                "const": "remove"
              "path":
                "type": "string"
            "required":
              - "op"
              - "path"
      "description": "Подмножество RFC 6902: add/replace/remove/test. move/copy не поддерживаются. Только разрешённые свойства."
