[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contracts"
version = "0.1.0"
description = "Shared gRPC contracts"
requires-python = ">=3.10"
dependencies = ["grpcio==1.71.2", "protobuf<6.0,>=5.26.1", "mypy-protobuf<4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["store*", "index_store*", "ws_forward*"]
