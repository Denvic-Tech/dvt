# WriteDataFrameToDBV4 chunksize sweep on the PostgreSQL 1M-row append benchmark.
# Run from the repository root (case paths are relative to it):
#   python -m services.task_benchmarking.main \
#     --pipeline services/task_benchmarking/pipelines/benchmarks/write/postgres/append_1m.json \
#     --matrix services/task_benchmarking/pipelines/benchmarks/matrix/write_chunksize.yaml
pipelines:
  - path: services/task_benchmarking/pipelines/benchmarks/write/postgres/append_1m.json
    name: pg-append-1m
cases:
  - name: pg-append-1m_chunksize-1000
    pipeline_name: pg-append-1m
    node_overrides:
      write:
        chunksize: 1000
  - name: pg-append-1m_chunksize-20000
    pipeline_name: pg-append-1m
    node_overrides:
      write:
        chunksize: 20000
  - name: pg-append-1m_chunksize-100000
    pipeline_name: pg-append-1m
    node_overrides:
      write:
        chunksize: 100000
