[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvt-extension-api"
version = "1.0.0"
description = "Stable public Python API for DVT extensions"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[tool.setuptools]
packages = ["dvt_extension_api", "dvt_extension_api.v1"]
package-dir = {"dvt_extension_api" = "."}
