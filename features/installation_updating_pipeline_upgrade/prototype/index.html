    /* Light palette, typography and control geometry from services/ui/src/shared/ui. */
    :root {
      color-scheme: light;
      font-family: "Geist Variable", "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #eef2f8;
      --muted: #6b7280;
      --line: rgba(148, 163, 184, .24);
      --primary: #6366f1;
      --strong: #4f46e5;
      --focus: rgba(99, 102, 241, .45);
      --shadow: 0 2px 8px rgba(15, 23, 42, .08);
      --control-radius: 15px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; }
    button, input, select { font: inherit; }
    button, select, .switch, .primary { cursor: pointer; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    header { background: white; border-bottom: 1px solid var(--line); }
    .bar { height: 68px; margin: auto; width: min(1200px, 100% - 64px); display: flex; align-items: center; gap: 20px; }
    .brand { display: inline-flex; gap: 12px; align-items: last baseline; }
    .brand img { width: 35px; height: 35px; display: block; }
    .wordmark { display: grid; line-height: 1; white-space: nowrap; }
    .wordmark span { color: #7c8794; font-size: 14px; letter-spacing: .01em; }
    .wordmark strong { color: #3535b8; font-size: 20px; font-weight: 700; }
    .context { padding-left: 20px; border-left: 1px solid var(--line); color: var(--muted); font-size: .94rem; }
    main { max-width: 826px; width: calc(100% - 64px); margin: clamp(32px, 6vh, 66px) auto 48px; }
    main.wide { max-width: 1200px; }
    h1 { margin: 0 0 26px; font-size: clamp(1.75rem, 3.4vw, 2rem); line-height: 1.15; letter-spacing: -.03em; font-weight: 600; }
    h2 { margin: 0; font-size: 1.08rem; font-weight: 650; letter-spacing: -.018em; }
    .card { background: white; border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
    .row { display: grid; grid-template-columns: minmax(180px, .9fr) minmax(0, 1fr); gap: 24px; align-items: center; padding: 20px 28px; }
    .row + .row { border-top: 1px solid #e9edf2; }
    .row.address-row { align-items: start; }
    .address-row .caption { padding-top: 7px; }
    .caption, .name { font-weight: 600; font-size: .99rem; }
    .hint { color: var(--muted); margin: 5px 0 0; font-size: .875rem; line-height: 1.45; font-weight: 400; }
    #addresses { display: grid; gap: 8px; }
    .address { display: flex; gap: 6px; align-items: center; }
    input:not([type=checkbox]), select {
      width: 100%; min-width: 0; height: 42px; border: 1px solid #dbe3f0; border-radius: var(--control-radius);
      color: inherit; padding: 0 14px; background: #fff;
      transition: border-color 150ms, box-shadow 150ms;
    }
    :is(input:not([type=checkbox]), select):hover { border-color: #b8b9fa; }
    :is(input:not([type=checkbox]), select):focus-visible { border-color: var(--primary); outline: 0; box-shadow: 0 0 0 3px rgba(99,102,241,.1); }
    select { appearance: none; padding-right: 36px; }
    .select-wrap { position: relative; }
    .select-wrap .icon { position: absolute; right: 13px; top: 12px; pointer-events: none; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .icon-btn { display: inline-grid; place-items: center; flex: none; width: 36px; height: 38px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); }
    .icon-btn:hover { color: var(--strong); background: #eef2ff; }
    .add { display: inline-flex; gap: 6px; align-items: center; color: var(--strong); background: transparent; border: 0; border-radius: 4px; font-size: .875rem; font-weight: 600; padding: 5px 2px; margin-top: 5px; }
    .add:hover { text-decoration: underline; }
    .switch { position: relative; justify-self: start; display: inline-flex; }
    .switch input { position: absolute; width: 100%; height: 100%; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .track { width: 40px; height: 24px; border-radius: 20px; background: #7e8d9e; pointer-events: none; }
    .track::after { content: ""; display: block; width: 18px; height: 18px; margin: 3px; border-radius: 50%; background: white; }
    .switch input:checked + .track { background: var(--primary); }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .switch input:focus-visible + .track { outline: 3px solid var(--focus); outline-offset: 3px; }
    .actions { padding: 19px 28px; border-top: 1px solid var(--line); background: #fafbfd; display: flex; justify-content: flex-end; }
    .primary { border: 1px solid transparent; border-radius: var(--control-radius); padding: 11px 20px; min-height: 42px; font-size: .95rem; font-weight: 500; background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: var(--shadow); color: white; text-decoration: none; text-align: center; }
    .primary:hover { background: linear-gradient(135deg, #4f46e5, #7c3aed); }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 25px; }
    .celebration { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
    .celebration i { position: absolute; width: 7px; height: 12px; border-radius: 2px; }
    .celebration .spark { width: 3px; height: 13px; border-radius: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      #open-dvt:not([hidden]) { animation: reveal .6s cubic-bezier(.22,1,.36,1) both; }
      @keyframes reveal {
        0% { opacity: 0; scale: .82; }
        55% { opacity: 1; scale: 1.05; box-shadow: 0 0 0 6px #6366f126; }
        100% { scale: 1; box-shadow: var(--shadow); }
      }
    }
    .heading h1 { margin: 0; }
    .columns { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(285px, 1fr); gap: 18px; align-items: start; }
    .panel-head { min-height: 64px; padding: 12px 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
    .tools { display: flex; gap: 2px; margin-left: auto; }
    .terminal {
      --scroll-thumb: #697b90;
      height: clamp(320px, 53vh, 580px);
      overflow: auto;
      scrollbar-gutter: stable;
      overscroll-behavior: contain;
      scrollbar-color: var(--scroll-thumb) transparent;
      padding: 18px;
      background: #182531;
      color: #edf3f9;
      font: .88rem/1.6 ui-monospace, Consolas, monospace;
    }
    .terminal:focus-visible { outline: 2px solid #a5b4fc; outline-offset: -2px; }
    @media (pointer: fine) and (forced-colors: none) {
      .terminal { scrollbar-width: thin; }
      @supports selector(::-webkit-scrollbar-thumb) {
        .terminal { scrollbar-width: auto; scrollbar-color: auto; }
        .terminal::-webkit-scrollbar { width: 16px; }
        .terminal::-webkit-scrollbar-track:vertical { margin-block: 12px; background: transparent; }
        .terminal::-webkit-scrollbar-button { display: none; }
        .terminal::-webkit-scrollbar-thumb {
          min-height: 36px;
          border: 4px solid transparent;
          border-radius: 999px;
          background: var(--scroll-thumb) padding-box;
        }
        .terminal::-webkit-scrollbar-thumb:hover { background-color: #9baec3; }
        .terminal::-webkit-scrollbar-thumb:active { background-color: #a5b4fc; }
      }
    }
    .log-line { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; margin-bottom: 5px; overflow-wrap: anywhere; }
    .log-line time { color: #a4b6c7; }
    ol { list-style: none; padding: 8px 20px; margin: 0; }
    .stage { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0; }
    .stage + .stage { border-top: 1px solid #eef1f5; }
    .stage strong { font-size: .96rem; font-weight: 600; }
    .stage small { display: block; margin-top: 2px; color: var(--muted); font-size: .875rem; }
    .mark { display: grid; place-items: center; width: 19px; height: 19px; border-radius: 50%; margin-top: 1px; border: 2px solid #bcc7d2; flex: none; }
    .active .mark { border-color: #c7d2fe; border-top-color: var(--primary); animation: spin .9s linear infinite; }
    .active small { color: var(--primary); }
    .done .mark { background: #15803d; border-color: #15803d; color: white; }
    .done .mark::before { content: "✓"; font: bold 12px/1 system-ui; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .active .mark { animation: none; } }
    .sr { position: absolute; width: 1px; height: 1px; clip-path: inset(50%); overflow: hidden; white-space: nowrap; }
    @media (max-width: 800px) { .columns { grid-template-columns: 1fr; } .terminal { height: 300px; } }
    @media (max-width: 590px) {
      .bar, main { width: calc(100% - 32px); }
      .bar { min-height: 60px; height: auto; gap: 10px; } .context { padding-left: 10px; font-size: .875rem; }
      .brand { gap: 7px; } .wordmark strong { font-size: 16px; } .brand img { width: 29px; height: 29px; }
      main { margin: 26px auto; } h1 { margin-bottom: 17px; }
      .row { grid-template-columns: 1fr; gap: 9px; padding: 15px 18px; }
      .row.address-row .caption { padding: 0; }
      .switch-row { grid-template-columns: 1fr auto; }
      .actions { padding: 16px 18px; } .actions .primary { width: 100%; }
      .panel-head { padding: 10px 14px; } .terminal { padding: 14px 12px; }
    }
  </style>
</head>
<body>
  <svg aria-hidden="true" style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="cross" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
    <symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
    <symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
  </svg>
  <header><div class="bar">
    <span class="brand"><img alt="" src="data:image/svg+xml,%3C%3Fxml%20version%3D%221.0%22%20encoding%3D%22UTF-8%22%3F%3E%0D%0A%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%203458394%203458394%22%20width%3D%22512%22%20height%3D%22512%22%20fill-rule%3D%22evenodd%22%20shape-rendering%3D%22geometricPrecision%22%3E%0D%0A%20%20%3Ctitle%3EDenvic%3C%2Ftitle%3E%0D%0A%20%20%3Cpolygon%20fill%3D%22%235B5BEF%22%20points%3D%221152779%2C1152592%202305860%2C0%203458220%2C47%203458231%2C1152546%202305395%2C2305429%202305674%2C1153419%22%2F%3E%0D%0A%20%20%3Cpolygon%20fill%3D%22%235B5BEF%22%20points%3D%2212%2C2305173%202305453%2C2305290%201151999%2C3458290%200%2C3458103%22%2F%3E%0D%0A%20%20%3Crect%20fill%3D%22%239C9CF6%22%20x%3D%222305649%22%20y%3D%222305290%22%20width%3D%221152418%22%20height%3D%221153101%22%2F%3E%0D%0A%3C%2Fsvg%3E"><span class="wordmark"><span>Denvic</span><strong>Visual Transformer</strong></span></span>
    <span class="context">Мастер установки</span>
  </div></header>
  <main>
    <section id="setup">
      <h1>Настройка установки</h1>
      <form id="settings" class="card">
        <div class="form-body">
          <div class="row address-row">
            <div class="caption" id="addr-label">Адреса DVT<p class="hint" id="addr-hint">Укажите адрес сервера, например http://dvt.example.ru.</p></div>
            <div role="group" aria-label="Адреса DVT">
              <div id="addresses"></div>
              <button type="button" class="add" id="add"><svg class="icon" aria-hidden="true"><use href="#plus"/></svg>Добавить адрес</button>
            </div>
          </div>
          <div class="row"><label class="name" for="version">Версия DVT</label>
            <div class="select-wrap"><select id="version"><option>1.23.0</option><option>1.22.0</option><option>1.24.0-rc8</option></select><svg class="icon" aria-hidden="true"><use href="#chevron"/></svg></div>
          </div>
          <div class="row">
            <label class="name" for="install-dir">Путь установки</label>
            <div>
              <input id="install-dir" type="text" value="/var/lib/dvt" required pattern="/.*"
                title="Абсолютный путь на сервере, например /srv/dvt"
                autocomplete="off" autocapitalize="none" spellcheck="false">
            </div>
          </div>
          <div class="row"><label class="name" for="port">Порт приложения</label><input id="port" type="number" min="1" max="65535" value="80" required></div>
          <div class="row"><label class="name" for="workers">Число воркеров</label><input id="workers" type="number" min="1" value="4" required></div>
          <div class="row switch-row"><label class="name" for="mcp">Включить AI MCP</label><span class="switch"><input id="mcp" role="switch" type="checkbox"><span class="track"></span></span></div>
        </div>
        <footer class="actions"><button class="primary" type="submit">Установить DVT</button></footer>
      </form>
    </section>
    <section id="operation" hidden>
      <div class="heading"><h1 id="progress-title" tabindex="-1">Установка DVT</h1>
        <a class="primary" id="open-dvt" target="_blank" rel="noopener noreferrer" hidden>Открыть DVT</a></div>
      <div class="columns">
        <section class="card"><div class="panel-head"><h2>Журнал установки</h2>
          <div class="tools">
            <button type="button" class="icon-btn" id="copy-log" aria-label="Скопировать логи" title="Скопировать логи"><svg class="icon" aria-hidden="true"><use href="#copy"/></svg></button>
            <button type="button" class="icon-btn" id="download-log" aria-label="Скачать логи" title="Скачать логи"><svg class="icon" aria-hidden="true"><use href="#download"/></svg></button>
          </div></div>
          <div id="terminal" class="terminal" role="log" aria-live="off" aria-label="Логи установки" tabindex="0"></div>
          <p id="copy-error" class="hint" role="alert" hidden>Не удалось скопировать логи. Скачайте их кнопкой рядом.</p>
        </section>
        <section class="card"><div class="panel-head"><h2>Этапы установки</h2></div><ol id="stages"></ol></section>
      </div>
      <span class="sr" role="status" id="notice"></span>
    </section>
  </main>
  <template id="address-template"><div class="address">
    <input type="text" inputmode="url" aria-label="Адрес DVT" aria-describedby="addr-hint" placeholder="http://dvt.example.ru" required autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="icon-btn" type="button" title="Удалить адрес" aria-label="Удалить адрес"><svg class="icon" aria-hidden="true"><use href="#cross"/></svg></button>
  </div></template>
  <script>
    const $ = (id) => document.getElementById(id);
    const addresses = $('addresses');
    const directory = $('install-dir');

    function selectedDirectory() {
      const parts = [];
      for (const part of directory.value.split('/')) {
        if (part === '..') parts.pop();
        else if (part && part !== '.') parts.push(part);
      }
      return '/' + parts.join('/');
    }

    function addAddress(value = 'http://', focus = true) {
      const row = $('address-template').content.firstElementChild.cloneNode(true);
      const input = row.querySelector('input');
      input.value = value;
      input.onblur = () => {
        const value = input.value.trim();
        if (value && !value.includes('://')) input.value = withHttpScheme(value);
      };
      input.oninput = () => input.setCustomValidity('');
      row.querySelector('button').onclick = () => {
        const next = row.nextElementSibling || row.previousElementSibling;
        row.remove();
        if (next) next.querySelector('input').focus();
        else addAddress();
      };
      addresses.append(row);
      if (focus) input.focus();
    }
    addAddress('http://' + (location.hostname || 'localhost'), false);
    $('add').onclick = () => addAddress();

    function withHttpScheme(value) {
      if (value.includes('://')) return value;
      const host = /^[0-9a-f:]+$/i.test(value) && value.includes(':') ? '[' + value + ']' : value;
      return 'http://' + host;
    }

    function applicationUrl(input) {
      const value = withHttpScheme(input.value.trim());
      if (!/^https?:\/\/[^/]/i.test(value)) throw new Error('invalid address');
      const url = new URL(value);
      if (!url.hostname || url.username || url.password || url.pathname !== '/' || url.search || url.hash || /[\\\s]/.test(value)) {
        throw new Error('invalid address');
      }
      // Addresses are hostnames; the form's application port is authoritative.
      url.port = $('port').value;
      return url.href;
    }

    const transcript = [];
    const pause = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    function log(message) {
      const time = new Date().toLocaleTimeString('ru-RU', { hour12: false });
      transcript.push('[' + time + '] ' + message);
      const terminal = $('terminal');
      const atEnd = terminal.scrollTop + terminal.clientHeight >= terminal.scrollHeight - 8;
      const line = document.createElement('div');
      line.className = 'log-line';
      const stamp = document.createElement('time');
      stamp.textContent = time;
      const text = document.createElement('span');
      text.textContent = message;
      line.append(stamp, text);
      terminal.append(line);
      if (atEnd) terminal.scrollTop = terminal.scrollHeight;
    }

    function makeStage(title) {
      const row = document.createElement('li');
      row.className = 'stage';
      row.innerHTML = '<span class="mark" aria-hidden="true"></span><div><strong></strong><small>В ожидании</small></div>';
      row.querySelector('strong').textContent = title;
      $('stages').append(row);
      return row;
    }
    function celebrate(button) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const layer = document.createElement('div');
      layer.className = 'celebration';
      layer.setAttribute('aria-hidden', 'true');
      document.body.append(layer);
      const rect = button.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const colors = ['#6366f1', '#8b5cf6', '#38bdf8', '#fbbf24', '#ec4899', '#34d399'];
      const flights = [];
      const burstScale = 1.5;
      function burst(x, y, count, reach, delay, sparks) {
        for (let i = 0; i < count; i++) {
          const angle = (i + Math.random() * .6) / count * Math.PI * 2;
          const radius = reach * burstScale * (.55 + Math.random() * .45);
          const dx = Math.cos(angle) * radius;
          const dy = Math.sin(angle) * radius;
          const piece = document.createElement('i');
          piece.style.left = x + 'px';
          piece.style.top = y + 'px';
          piece.style.background = colors[i % colors.length];
          if (sparks) piece.className = 'spark';
          layer.append(piece);
          const rotation = angle * 180 / Math.PI + 90;
          const spin = sparks ? 0 : Math.random() * 460 - 230;
          const drop = (sparks ? 8 : 58) * burstScale;
          const frames = [
            { transform: 'rotate(' + rotation + 'deg) scale(.3)', opacity: 0 },
            { opacity: 1, offset: .1 },
            { transform: 'translate(' + dx * .8 + 'px,' + dy * .8 + 'px) rotate(' + (rotation + spin / 2) + 'deg)', opacity: 1, offset: .55 },
            { transform: 'translate(' + dx + 'px,' + (dy + drop) + 'px) rotate(' + (rotation + spin) + 'deg) scale(.45)', opacity: 0 }
          ];
          flights.push(piece.animate(frames, {
            duration: (sparks ? 620 : 1150) + Math.random() * 260,
            delay, easing: 'ease-out', fill: 'both'
          }).finished);
        }
      }
      burst(cx, cy, 44, 155, 0, false);
      burst(cx - 68 * burstScale, cy - 38 * burstScale, 14, 47, 170, true);
      burst(cx + 55 * burstScale, cy + 18 * burstScale, 14, 39, 300, true);
      Promise.allSettled(flights).then(() => layer.remove());
    }

    async function simulate(urls, installDir) {
      const version = $('version').value;
      const services = ['gateway', 'orchestrator', 'project-scheduler', 'task-worker', 'ui', 'proxy'];
      if ($('mcp').checked) services.push('ai-mcp');
      const stages = [
        ['Подготовка', [
          'Проверка окружения Docker', 'Docker Engine доступен', 'Docker Compose доступен',
          'Проверка свободного места', 'Проверка прав на запись в ' + installDir,
          'Каталог ' + installDir + ' готов',
          'Рабочий каталог: ' + installDir, 'Подготовка сети контейнеров',
          'Порт приложения: ' + $('port').value, 'Адреса DVT: ' + urls.join(', '),
          'Конфигурация установки сформирована'
        ]],
        ['Загрузка образов', [
          'Получение манифеста DVT ' + version, 'Получен список образов',
          ...services.flatMap(name => [
            name + ': получение списка слоёв',
            name + ': загрузка 25%', name + ': загрузка 61%', name + ': загрузка 100%',
            name + ': проверка контрольной суммы', name + ': образ готов'
          ]),
          'Образы загружены и проверены'
        ]],
        ['Настройка базы данных', [
          'Подключение тома PostgreSQL', 'Запуск PostgreSQL', 'Ожидание ответа PostgreSQL',
          'PostgreSQL принимает подключения', 'Проверка схемы базы данных',
          'Начало транзакции миграции', 'Подготовка таблиц', 'Проверка индексов',
          'Транзакция завершена', 'Миграции базы данных применены'
        ]],
        ['Запуск сервисов', [
          'Запуск сервисов из каталога ' + installDir,
          'Запуск Valkey', 'Valkey принимает подключения',
          ...services.flatMap(name => [name + ': создание контейнера', name + ': запуск процесса']),
          'Ожидание регистрации воркеров', 'Запущено воркеров: ' + $('workers').value,
          $('mcp').checked ? 'Сервис AI MCP запущен' : 'AI MCP отключён'
        ]],
        ['Проверка доступности', [
          ...services.map(name => name + ': проверка готовности пройдена'),
          'Проверка маршрута до Gateway', 'Проверка ответа веб-интерфейса',
          'Адреса DVT: ' + urls.join(', '), 'Установка DVT ' + version + ' завершена'
        ]]
      ];
      const rows = stages.map(([title]) => makeStage(title));
      for (const [index, [title, messages]] of stages.entries()) {
        const row = rows[index];
        row.className = 'stage active';
        row.querySelector('small').textContent = 'Выполняется';
        $('notice').textContent = title;
        for (const message of messages) {
          log(message);
          await pause(240);
        }
        row.className = 'stage done';
        row.querySelector('small').textContent = 'Готово';
      }
      $('progress-title').textContent = 'DVT установлен';
      $('notice').textContent = 'Установка завершена. Можно открыть DVT.';
      $('open-dvt').href = urls[0];
      $('open-dvt').hidden = false;
      celebrate($('open-dvt'));
    }

    $('settings').onsubmit = (event) => {
      event.preventDefault();
      const urls = [];
      for (const input of addresses.querySelectorAll('input')) {
        try { urls.push(applicationUrl(input)); }
        catch {
          input.setCustomValidity('Введите адрес сервера, например http://dvt.example.ru.');
          input.reportValidity();
          return;
        }
      }
      $('setup').hidden = true;
      $('operation').hidden = false;
      document.querySelector('main').classList.add('wide');
      $('progress-title').focus();
      simulate(urls, selectedDirectory());
    };

    async function copyLogs() {
      const text = transcript.join('\n');
      if (navigator.clipboard?.writeText) {
        try { await navigator.clipboard.writeText(text); return true; }
        catch { /* Use selection-based copying when clipboard access is restricted. */ }
      }
      const buffer = document.createElement('textarea');
      buffer.className = 'sr';
      buffer.value = text;
      document.body.append(buffer);
      buffer.select();
      try { return document.execCommand('copy'); }
      finally { buffer.remove(); $('copy-log').focus(); }
    }
    let copyReset;
    $('copy-log').onclick = async () => {
      const copied = await copyLogs().catch(() => false);
      $('copy-error').hidden = copied;
      if (!copied) return;
      $('notice').textContent = 'Логи скопированы';
      const icon = $('copy-log').querySelector('use');
      icon.setAttribute('href', '#check');
      clearTimeout(copyReset);
      copyReset = setTimeout(() => icon.setAttribute('href', '#copy'), 1800);
    };
    $('download-log').onclick = () => {
      const link = document.createElement('a');
      const blob = new Blob([transcript.join('\n') + '\n'], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = 'dvt-installation.log';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
  </script>
</body>
